name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Format
        run: cargo fmt --manifest-path core/Cargo.toml --check
      - name: Unit tests
        run: cargo test --lib --manifest-path core/Cargo.toml
      - name: End-to-end tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq openssh-server
          scripts/e2e-sshd.sh

  android:
    name: Android app
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
      - name: Build Rust core
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" scripts/build-core.sh
      - name: Unit and screenshot tests
        run: ./gradlew testDebugUnitTest
      - name: Build release APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: codetab-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
